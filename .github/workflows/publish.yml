name: Publish to npm

# Publishing uses npm trusted publishing (OIDC). GitHub proves this workflow's
# identity to npm at publish time, so there is no long-lived token stored
# anywhere. This is deliberate: npm is retiring 2FA-bypass tokens — sensitive
# account actions were blocked in August 2026 and direct publishing goes away
# around January 2027 — so a stored publish token would have been a dead end.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs a recent npm.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Publish
        run: npm publish --provenance --access public
